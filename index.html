<title>◯◯◯ 文章メーカー</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root {
  /* 紙のような生成り色とテラコッタのアクセント */
  --bg: #faf7f2;
  --fg: #2b2622;
  --muted: #8a8078;
  --card: #fffdf9;
  --line: #e6ddd2;
  --accent: #b5562f;
  --hi: #f6e3d6;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1d1a17;
    --fg: #f1ebe3;
    --muted: #a39a90;
    --card: #27231f;
    --line: #3c3630;
    --accent: #e08a62;
    --hi: #4a2f22;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1d1a17;
  --fg: #f1ebe3;
  --muted: #a39a90;
  --card: #27231f;
  --line: #3c3630;
  --accent: #e08a62;
  --hi: #4a2f22;
  color-scheme: dark;
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  line-height: 1.7;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 56px;
}
.wrap { max-width: 640px; margin: 0 auto; }
h1 { font-size: 1.4rem; margin: 0 0 4px; text-wrap: balance; }
.lead { color: var(--muted); font-size: .9rem; margin: 0 0 20px; }
label { display: block; font-size: .85rem; color: var(--muted); margin-bottom: 6px; }
input#word {
  width: 100%;
  box-sizing: border-box;
  font: inherit;
  font-size: 1.1rem;
  padding: 12px 14px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--card);
  color: var(--fg);
}
input#word::placeholder { color: var(--muted); }
.toolbar {
  display: flex;
  gap: 8px;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  margin: 18px 0 10px;
}
.count { color: var(--muted); font-size: .85rem; }
button {
  font: inherit;
  font-size: .9rem;
  padding: 8px 14px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--fg);
  cursor: pointer;
}
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button:disabled { opacity: .45; cursor: default; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
textarea#output {
  width: 100%;
  box-sizing: border-box;
  min-height: 260px;
  font: inherit;
  font-size: 1rem;
  line-height: 1.9;
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--card);
  color: var(--fg);
  resize: vertical;
  overflow-wrap: anywhere;
}
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  background: var(--fg);
  color: var(--bg);
  padding: 8px 14px;
  border-radius: 8px;
  font-size: .9rem;
  opacity: 0;
  transition: opacity .2s;
  pointer-events: none;
}
.toast.show { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>

<main class="wrap">
  <h1>◯◯◯ 文章メーカー</h1>
  <p class="lead">◯◯◯ に入れたい言葉を入力すると、下の文章がまとめてその言葉に置き換わります。ボタンを押すと全文をコピーできます。</p>

  <label for="word">◯◯◯ に入れる言葉</label>
  <input id="word" type="text" placeholder="例：さくら" autocomplete="off">

  <div class="toolbar">
    <span class="count" id="count"></span>
    <button class="primary" id="copyAll" type="button">全文をコピー</button>
  </div>

  <textarea id="output" readonly aria-label="完成した文章"></textarea>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  var PH = "◯◯◯";
  var SENTENCES = [
    "◯◯◯ 友達から恋人はむずい",
    "◯◯◯の好きなタイプをもっと知りたい",
    "また◯◯◯とのメンバーでどっか行きたい",
    "◯◯◯好きすぎて滅",
    "◯◯◯との恋が叶わなくてもずっとそばにいてほしい",
    "◯◯◯のそういうとこが好きだよ",
    "僕はいつか◯◯◯の恋人になりたい",
    "◯◯◯やっぱり好き",
    "◯◯◯の好きなタイプもっと知りたい",
    "◯◯◯早く気づいて"
  ];

  var input = document.getElementById("word");
  var output = document.getElementById("output");
  var count = document.getElementById("count");
  var copyAll = document.getElementById("copyAll");
  var toast = document.getElementById("toast");
  var toastTimer = null;

  function fill(sentence, word) {
    return sentence.split(PH).join(word);
  }

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.classList.remove("show"); }, 1600);
  }

  function fallbackCopy(text) {
    output.removeAttribute("readonly");
    output.focus();
    output.select();
    output.setSelectionRange(0, output.value.length);
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    output.setAttribute("readonly", "");
    return ok;
  }

  function copyText(text) {
    var done = function (ok) {
      showToast(ok ? "コピーしました" : "コピーできませんでした。文章を選んでコピーしてください");
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        done(true);
      }).catch(function () {
        done(fallbackCopy(text));
      });
    } else {
      done(fallbackCopy(text));
    }
  }

  function render() {
    var word = input.value.trim();
    var hasWord = word.length > 0;
    count.textContent = hasWord ? (SENTENCES.length + " 件の文章をまとめて表示中") : "言葉を入力すると文章が完成します";
    copyAll.disabled = !hasWord;
    output.value = hasWord
      ? SENTENCES.map(function (s) { return fill(s, word); }).join("\n")
      : "";
  }

  input.addEventListener("input", render);

  copyAll.addEventListener("click", function () {
    if (!output.value) return;
    copyText(output.value);
  });

  render();
})();
</script>
